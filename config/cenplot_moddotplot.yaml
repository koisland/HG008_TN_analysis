settings:
  title: "{chrom}"
  layout: constrained
  format:
    - png
    - pdf
  transparent: false
  dim:
    - 16
    - 8
  axis_h_pad: 0.05
  dpi: 600
tracks:
  - title: |-
      Mean CpG
      methylation
      (%)
    position: relative
    type: bar
    proportion: 0.1
    path: "methyl"
    options:
      hide_x: true
      ymax: 100
  - position: relative
    proportion: 0.05
    type: label
    path: "rm"
    options:
      legend: false
      hide_x: true
      bg_border: true
  - position: relative
    type: selfident
    proportion: 0.7
    path: "ident"
    options:
      legend: true
      hide_x: true
      invert: true
      legend_asp_ratio: 1
  - position: relative
    type: position
    proportion: 0.05
